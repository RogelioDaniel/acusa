<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acusa · API de facturación</title>
<link rel="stylesheet" href="swagger-ui.css">
<style>
body{margin:0;background:#fafafa}
#sesion{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px;background:#16231d;color:#fff;font:14px "Segoe UI",Arial,sans-serif}
#sesion b{margin-right:8px}
#sesion input{padding:5px 8px;border:1px solid #cfd6cc;border-radius:3px;font:inherit;min-width:210px}
#sesion button{padding:6px 14px;border:0;border-radius:3px;background:#0b6b50;color:#fff;font:inherit;cursor:pointer}
#estado{margin-left:8px;color:#bfe3d3}
#estado.error{color:#ffb4a8}
</style></head><body>
<div id="sesion">
  <b>Acusa · API de facturación</b>
  <input id="llave" type="password" placeholder="Llave de API (ak_…)" autocomplete="off">
  <button id="entrar" type="button">Obtener token</button>
  <span id="estado">Pegue su llave de API para probar las rutas.</span>
</div>
<div id="swagger-ui"></div>
<script src="swagger-ui-bundle.js"></script>
<script>
  const ui = SwaggerUIBundle({
    url: "openapi.yaml",
    dom_id: "#swagger-ui",
    deepLinking: true,
    persistAuthorization: false,
    tryItOutEnabled: true,
  });
  const estado = document.getElementById("estado");
  async function entrar() {
    estado.className = ""; estado.textContent = "Pidiendo el token…";
    try {
      const r = await fetch("/api/auth/token", { method: "POST", headers: { "x-api-key": document.getElementById("llave").value.trim() } });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error("La llave no es válida o fue revocada.");
      ui.preauthorizeApiKey("bearerAuth", j.token);
      document.getElementById("llave").value = "";
      estado.textContent = "Token listo (dura una hora). Ya puede usar «Try it out» en cualquier ruta.";
    } catch (e) { estado.className = "error"; estado.textContent = e.message; }
  }
  document.getElementById("entrar").addEventListener("click", entrar);
  document.getElementById("llave").addEventListener("keydown", e => { if (e.key === "Enter") entrar(); });
</script>
</body></html>
