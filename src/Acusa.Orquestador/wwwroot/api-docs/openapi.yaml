tags:
- name: Usuarios
  description: Registro de nuevos usuarios
- name: Sesiones de Usuario
  description: Autenticación de usuarios
- name: Refresh Token
  description: Renovación de tokens de acceso
- name: Información de Usuario
  description: Datos del usuario autenticado
- name: Verificación de Correo
  description: Verificación de la dirección de correo del usuario autenticado
- name: Compañías
  description: Gestión de compañías
- name: Productos
  description: Gestión de productos
- name: Direcciones
  description: Gestión de direcciones de compañías
- name: Empresas Emisoras
  description: Gestión de empresas emisoras de facturas
- name: Invitaciones
  description: Invitaciones para vincular usuarios con empresas emisoras
- name: Facturas
  description: Gestión de facturas electrónicas bajo una empresa emisora
- name: Movimientos
  description: Gestión de movimientos de facturas
servers:
- url: /
  description: Acusa (este servidor)
- url: https://facturacion-desarrollo-f897c52df65a.herokuapp.com
  description: Facturación de Alain, desarrollo (solo para comparar)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Pegue su llave de API (empieza con ak_) o un token obtenido en
        /api/auth/token o /users/sessions.
  schemas:
    user:
      type: object
      properties:
        email:
          type: string
          example: facturacion@admin.com
        password:
          type: string
          example: P455w0rd!
        password_confirmation:
          type: string
          example: P455w0rd!
      required:
      - email
      - password
      - password_confirmation
    company:
      type: object
      properties:
        client_type:
          type: integer
          example: 1
        credit_limit:
          type: integer
          example: 50000
        rfc:
          type: string
          example: XAXX010101000
        social_reason:
          type: string
          example: EMPRESA SA DE CV
      required:
      - client_type
      - credit_limit
      - rfc
      - social_reason
    invoice:
      type: object
      properties:
        concept:
          type: string
          example: '5'
        series:
          type: string
          example: A
        invoice_date:
          type: string
          format: date
          example: '2026-05-14'
        client_code:
          type: string
          example: COMPANY001
        payment_method:
          type: string
          example: '01'
          description: 01 = Efectivo, 02 = Cheque nominativo, 03 = Transferencia electrónica
            de fondos, 04 = Tarjeta de crédito, 05 = Monedero electrónico, 06 = Dinero
            electrónico, 28 = Tarjeta de débito, 29 = Tarjeta de servicios, 99 = Por
            definir
        cfdi:
          type: string
          example: G03
          description: Uso del CFDI (ver catálogo en /issuing_companies/{id}/invoices/new)
        tax_regime:
          type: string
          example: '601'
          description: Régimen fiscal (ver catálogo en /issuing_companies/{id}/invoices/new)
        movements_attributes:
          type: array
          items:
            type: object
            properties:
              product_code:
                type: string
                example: PRODUCT001
              quantity:
                type: integer
                example: 2
              price:
                type: number
                example: 2000.0
                nullable: true
                description: Si se omite se usa el precio del producto
              vat_percentage:
                type: number
                example: 16
                nullable: true
                description: Porcentaje de IVA (CPORCENTAJEIMPUESTO1). Si se omite
                  no se aplica IVA
              vat_retention_percentage:
                type: number
                example: 10.6
                nullable: true
                description: Porcentaje de retención de IVA (CPORCENTAJEIMPUESTO4).
                  Si se omite no se aplica retención
              ieps_percentage:
                type: number
                example: 1
                nullable: true
                description: Porcentaje de IEPS (CPORCENTAJEIMPUESTO2). Si se omite
                  no se aplica IEPS
            required:
            - product_code
            - quantity
      required:
      - concept
      - series
      - invoice_date
      - client_code
      - payment_method
      - cfdi
      - tax_regime
    issuing_company:
      type: object
      properties:
        social_reason:
          type: string
          example: EMPRESA EMISORA SA DE CV
        rfc:
          type: string
          example: EEM010101AAA
        database_name:
          type: string
          example: db_empresa_emisora
          description: Nombre de la base de datos en ContPAQ
      required:
      - social_reason
      - rfc
      - database_name
    product:
      type: object
      properties:
        name:
          type: string
          example: Servidor Pro
        price:
          type: string
          example: '2000.00'
        issuing_company_id:
          type: integer
          example: 1
          description: ID de la empresa emisora a la que pertenece el producto
        description:
          type: string
          example: Renta de Servidor Pro
        unit_base:
          type: string
          example: Unidad de Servicio
        series_sat:
          type: string
          example: '81112200'
        product_type:
          type: integer
          example: 1
          description: '1: materia prima, 2: producto terminado, 3: servicio'
        extra_texts_attributes:
          type: array
          items:
            type: object
            properties:
              extra_text:
                type: string
                example: Texto adicional para la factura
            required:
            - extra_text
      required:
      - name
      - price
      - description
      - unit_base
      - series_sat
      - product_type
    movement:
      type: object
      properties:
        product_code:
          type: string
          example: SERV001
        quantity:
          type: integer
          example: 2
        price:
          type: number
          example: 2000.0
          nullable: true
          description: Si se omite se usa el precio del producto
        vat_percentage:
          type: number
          example: 16
          nullable: true
          description: Porcentaje de IVA (CPORCENTAJEIMPUESTO1). Si se omite no se
            aplica IVA
        vat_retention_percentage:
          type: number
          example: 10.6
          nullable: true
          description: Porcentaje de retención de IVA (CPORCENTAJEIMPUESTO4). Si se
            omite no se aplica retención
        ieps_percentage:
          type: number
          example: 1
          nullable: true
          description: Porcentaje de IEPS (CPORCENTAJEIMPUESTO2). Si se omite no se
            aplica IEPS
        invoice_id:
          type: integer
          example: 1
      required:
      - product_code
      - quantity
      - invoice_id
