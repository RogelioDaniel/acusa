                  state:
                    type: string
                    example: CDMX
                  country:
                    type: string
                    example: México
                  status:
                    type: string
                    example: completed
                    enum:
                    - pending
                    - completed
                    - failed
                  address_type:
                    type: integer
                    example: 0
                    description: 0 = fiscal, 1 = envío
                  catalog_type:
                    type: integer
                    example: 1
                    description: 1 = cliente, 2 = proveedor, 3 = documentos, 4 = empresas
        '404':
          description: Dirección no encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
