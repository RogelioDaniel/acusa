---
openapi: 3.0.1
info:
  title: Facturacion API sobre Acusa
  version: v1
  description: |
    API REST de facturación y timbrado de facturas electrónicas sobre CONTPAQi Comercial, con los mismos caminos, métodos y nombres de campo de la API de Alain.

    **Cómo probar:** pegue su llave de API (empieza con `ak_`) arriba y pulse «Obtener token»; después «Try it out» en cualquier ruta.

    **Disponibles:** empresas emisoras, compañías, direcciones, productos, facturas (crear, editar, timbrar con `xml` en texto plano, cancelar, XML y PDF, lote de timbrado) y movimientos.
    **No disponibles en Acusa** (responden 404 o 501): reportes, descargas, usuarios, invitaciones, cargas masivas por Excel, prefactura/proforma y carga de sellos por API.
    Las operaciones que escriben en CONTPAQi requieren un Acusa Worker en línea.
paths:
  "/companies/{company_id}/addresses":
    parameters:
    - name: company_id
      in: path
      schema:
        type: integer
      required: true
      description: ID de la compañía
    get:
      summary: Listar direcciones de una compañía
      tags:
      - Direcciones
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
        required: false
        description: Número máximo de resultados
      - name: offset
        in: query
        schema:
          type: integer
        required: false
        description: Desplazamiento para paginación
      - name: order_by_field
        in: query
        schema:
          type: string
        required: false
        description: Campo por el cual ordenar los resultados
      - name: order_by_direction
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
        required: false
        description: Dirección de ordenamiento (ascendente o descendente)
      responses:
        '200':
          description: Direcciones obtenidas exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    street:
                      type: string
                      example: Av. Insurgentes Sur 123
                    neighborhood:
                      type: string
                      example: Del Valle
                    zip_code:
                      type: string
                      example: '03100'
                    city:
                      type: string
                      example: Ciudad de México
                    state:
                      type: string
                      example: CDMX
                    country:
                      type: string
                      example: México
                    status:
                      type: string
                      example: completed
                      enum:
                      - pending
                      - completed
                      - failed
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - No authorization headers provided
    post:
      summary: Crear una nueva dirección
      tags:
      - Direcciones
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '201':
          description: Dirección creada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
        '422':
          description: Error de validación
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - Street can't be blank
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - No authorization headers provided
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: object
                  properties:
                    street:
                      type: string
                      example: Av. Insurgentes Sur 123
                    neighborhood:
                      type: string
                      example: Del Valle
                    zip_code:
                      type: string
                      example: '03100'
                    city:
                      type: string
                      example: Ciudad de México
                    state:
                      type: string
                      example: CDMX
                    country:
                      type: string
                      example: México
                    address_type:
                      type: integer
                      example: 0
                      description: 0 = fiscal, 1 = envío
                    catalog_type:
                      type: integer
                      example: 1
                      description: 1 = cliente, 2 = proveedor, 3 = documentos, 4 =
                        empresas
                  required:
                  - street
                  - neighborhood
                  - zip_code
                  - city
                  - state
                  - country
                  - address_type
                  - catalog_type
              required:
              - address
