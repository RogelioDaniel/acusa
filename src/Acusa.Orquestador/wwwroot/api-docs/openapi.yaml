  "/issuing_companies/{issuing_company_id}/upload_seals":
    parameters:
    - name: issuing_company_id
      in: path
      schema:
        type: integer
      required: true
      description: ID de la empresa emisora
    post:
      summary: Sube el Certificado de Sello Digital (CSD) de la empresa emisora
      tags:
      - Empresas Emisoras
      description: Debe llamarse después de crear la empresa emisora con POST /issuing_companies.
        Sin un CSD vigente la empresa emisora no puede timbrar facturas.
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '200':
          description: Sello guardado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
        '422':
          description: La llave privada no corresponde al certificado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - Key file does not match the provided certificate
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                    - No authorization headers provided
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                company[cer]:
                  type: string
                  format: binary
                  description: Archivo .cer emitido por el SAT
                company[key]:
                  type: string
                  format: binary
                  description: Archivo .key emitido por el SAT
                company[csd_password]:
                  type: string
                  description: Contraseña de la llave privada
                company[csd_valid_until]:
                  type: string
                  description: Fecha de vencimiento del sello (YYYY-MM-DD)
              required:
              - company[cer]
              - company[key]
              - company[csd_password]
              - company[csd_valid_until]
        required: true
        description: Certificado de Sello Digital de la empresa emisora
