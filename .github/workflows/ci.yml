name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Windows: el worker usa el SDK de CONTPAQi (32 bits) y el escritorio es WPF.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore Acusa.Sdk.slnx

      - name: Compilar
        run: dotnet build Acusa.Sdk.slnx --no-restore -c Release

      - name: Pruebas
        run: dotnet test Acusa.Sdk.slnx --no-build -c Release --logger "trx;LogFileName=resultados.trx" --results-directory TestResults

      - name: Guardar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults/*.trx
